<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/galeria.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div>
            <img onclick="window.location.href='../index.html'" src="/Resource/Img/Logo.png" id="logo" alt="">
            <h1>E-Criva</h1>
        </div>
        <div id="sech" onclick="">
            <img src="/Resource/Img/Luna.png" alt="">
        </div>   
    </header>
    <nav>
        <div>
            <p id="tapaSub">Mundo ▼</p> 
            <div id="subsu">
                <p onclick="window.location.href='historias.html'">Historia</p>
                <p onclick="window.location.href='objetos.html'">Objeto</p>
                <p onclick="window.location.href='personajes.html'">Personajes</p>
            </div>
        </div>
        
        <p onclick="window.location.href='galeria.html'">Galeria</p>
        <p onclick="window.location.href='contacto.html'">Contactos</p>
    </nav>
    <main>
        <div id="sea">
            <div id="ipo">
                <input type="text" name="var" id="var">
                <img src="/Resource/Img/Lupa.png" alt="">
            </div>
            <div id="filters">
                <strong>≡</strong>
            </div>
        </div>
    </main>
    <footer>
        <div id="super">
            <div>
                <h3>Documentos legales</h3>
                <div id="leyes">
                    <p>Aviso legal</p>
                    <p>Política de privacidad y protección de datos</p>
                    <p>Política de cookies</p>
                    <p>Términos y condiciones de uso</p>
                </div>
            </div>
            <div>
                <h3 id="RedesTitle">Redes sociales</h3>
                <div id="media">        
                    <img src="/Resource/Img/DA.png" alt="">
                    <img src="/Resource/Img/Facebook.png" alt="">
                    <img src="/Resource/Img/Tiktok.png" alt="">
                    <img src="/Resource/Img/Youtube.png" alt="">
                </div>
            </div>
        </div>
        <legend> Copyright © 2026 e-criva. All rights reserved. </legend>
    </footer>
    <div id="background">
        <div id="Img"></div>
        <div id="Audio"></div>
        <div id="Video"></div>
        <div id="menu">
            <div id="alcance">
                <button>
                    <img src="/Resource/Img/Pc.png" alt="">
                </button>
                <button>
                    <img src="/Resource/Img/World.png" alt="">
                </button>
            </div>
            <select name="tipos" id="tipos">
                <option value="todas">Todas</option>
                <option value="imagenes">Imagenes</option>
                <option value="audio">Audio</option>
                <option value="video">Video</option>
            </select>
            <div id="final">
                <button onclick="closer()">Cancelar</button>
                <button onclick="closer()">Aceptar</button>
            </div>
        </div>
    </div>
    <div id="Shadow">
        <img src="" alt="">
    </div>
    <script>
        let dark = document.getElementById("sech")
        dark.addEventListener("click",()=>{
            let img = dark.children.item(0)
            let all =document.querySelectorAll("*")
            if(all[1].classList.contains("oscuro")) img.setAttribute("src","/Resource/img/Sol.png")
            else img.setAttribute("src","Resource/img/Luna.png")
            all.forEach(Element=>{
                Element.classList.toggle("oscuro")
            })
        })
    </script>
    <script>
        let menu = document.getElementById("filters")
        menu.addEventListener("click",()=>{
            document.getElementById("background").classList.add("activo")
        })
        function closer(){
            document.getElementById("background").classList.remove("activo")
        }
    </script>
    <script src="/js/base.js"></script>
    <script type="module">
        import { openDB } from 'https://cdn.jsdelivr.net/npm/idb@8/build/index.js'; 
    </script>
</body>
</html>
